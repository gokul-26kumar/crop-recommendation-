      <!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <style>
        h1 {
            color: mediumseagreen;
            text-align: center;
        }
        .card {
            margin-left: auto;
            margin-right: auto;
            margin-top: 20px;
            width: 50%;
            color: white;
        }
        .container {
            background: #edf2f7;
            font-weight: bold;
            padding-bottom: 20px;
            border-radius: 15px;
        }
    </style>
  </head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Crop Recommendation</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item">
              <a class="nav-link" href="/about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/predict">Prediction</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/logout">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="hero conteiner">
      <body class="bimg"></body>
    </section>


    <!--=======================Form Section================================================-->
    <div class="container my-3 mt-3">
      <h1 class="text-success">Crop Recommendation System <span class="text-success">🌱</span></h1>

      <!-- Form for crop prediction -->
      <form action="/predict" method="POST">
          <div class="row">
              <div class="col-md-4">
                <label for="Nitrogen">Nitrogen</label>
                <input type="number" id="Nitrogen" name="Nitrogen" placeholder="Enter Nitrogen value" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label for="Phosphorus">Phosphorus</label>
                <input type="number" id="Phosphorus" name="Phosporus" placeholder="Enter Phosphorus value" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label for="Potassium">Potassium</label>
                <input type="number" id="Potassium" name="Potassium" placeholder="Enter Potassium value" class="form-control" required>
              </div>
          </div>

          <div class="row mt-4">
              <div class="col-md-4">
                <label for="temperature">Temperature (°C)</label>
                <input type="number" step="0.01" id="temperature" name="temperature" placeholder="Enter temperature in °C" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label for="ph">pH</label>
                <input type="number" step="0.01" id="ph" name="ph" placeholder="Enter pH value" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label for="humidity">Humidity (%)</label>
                <input type="number" step="0.01" id="humidity" name="humidity" placeholder="Enter humidity in %" class="form-control" required>
              </div>
          </div>

          <div class="row mt-4">
              <div class="col-md-4">
                <label for="rainfall">Rainfall (mm)</label>
                <input type="number" step="0.01" id="rainfall" name="rainfall" placeholder="Enter rainfall in mm" class="form-control" required>
              </div>
          </div>

          <div class="row mt-4">
              <div class="col-md-12 text-center">
                <button type="submit" class="btn btn-primary btn-lg">Get Recommendation</button>
              </div>
          </div>
      </form>

      <!-- Display result card after prediction -->
      {% if result %}
      <div class="card bg-dark text-white mt-4">
        <div class="card-body">
          <h5 class="card-title">Recommended Crop for Cultivation:</h5>
          <p class="card-text">{{ result }}</p>
        </div>
      </div>
      {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  </body>
</html>
