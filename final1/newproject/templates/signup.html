
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        background-color: rgba(23, 23, 23, 0.8);
      }
      .form-container {
        width: 350px;
        border-radius: 0.75rem;
        background-color: rgba(23, 23, 23, 0.8);
        padding: 2rem;
        color: rgba(243, 244, 246, 1);
        margin: 100px 550px;
      }

      .title {
        text-align: center;
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 700;
      }

      .form {
        margin-top: 1.5rem;
        margin-right: 1.5rem;
      }

      .input-group {
        margin-top: 0.25rem;
        font-size: 0.875rem;
        line-height: 1.25rem;
      }

      .input-group label {
        display: block;
        color: rgba(156, 163, 175, 1);
        margin-bottom: 4px;
      }

      .input-group input {
        width: 100%;
        border-radius: 0.375rem;
        border: 1px solid rgba(55, 65, 81, 1);
        outline: 0;
        background-color: rgba(49, 53, 52, 0.8);
        padding: 0.75rem 1rem;
        color: rgba(243, 244, 246, 1);
      }

      .input-group input:focus {
        border-color: rgba(14, 83, 14, 0.362);
      }

      .forgot {
        display: flex;
        justify-content: flex-end;
        font-size: 0.75rem;
        line-height: 1rem;
        color: rgba(156, 163, 175, 1);
        margin: 8px 0 14px 0;
      }

      .forgot a,
      .signup a {
        color: rgba(243, 244, 246, 1);
        text-decoration: none;
        font-size: 14px;
      }

      .forgot a:hover,
      .signup a:hover {
        text-decoration: underline rgba(167, 139, 250, 1);
      }

      .sign {
        display: block;
        width: 100%;
        background-color: rgba(14, 83, 14, 0.362);
        padding: 0.75rem;
        text-align: center;
        color: rgb(255, 255, 255);
        border: 0;
        border-radius: 0.375rem;
        font-weight: 600;
        margin: 20px;
        width: 100%;
      }

      .signup {
        text-align: center;
        font-size: 0.75rem;
        line-height: 1rem;
        color: rgba(156, 163, 175, 1);
      }
    </style>
  </head>
  <body></body>
</html>

<body>
  <div class="form-container">
    <p class="title">Sign Up</p>
    <form class="form" method="POST" action="/signup">
      <div class="input-group">
        <label for="username">Username</label>
         <input type="text" name="username" id="username" placeholder="Enter username" pattern="[A-Za-z]+" title="Username must only contain alphabets (A-Z or a-z)" required/>


      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter password"
               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
               title="Password must be at least 8 characters long, contain at least one number, one uppercase and one lowercase letter" required/>
      </div>
      <button class="sign">Sign In</button>
    </form>

    <p class="signup">
      Return to
      <a rel="noopener noreferrer" href="/login" class="">login</a>
    </p>
  </div>
</body>
